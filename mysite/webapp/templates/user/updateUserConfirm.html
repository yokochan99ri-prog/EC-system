{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員情報の更新</title>
    <link rel="stylesheet" type="text/css" href="{% static 'webapp/css/style.css' %}" />
</head>
<body>
    <h2>以下の会員情報で更新しますか？</h2>

    {{ form.non_field_errors }}

    <form action="{% url 'webapp:M08' %}" method="POST">
        {% csrf_token %}
        <table>
            <tr>
                <th>会員ID:</th>
                <td>
                    {{ form.user_id.value }}
                    <input type="hidden" name="user_id" value="{{ form.user_id.value }}">
                </td>
            </tr>
            <tr>
                <th>パスワード:</th>
                <td>
                    ******
                    {% if form.password.value %}
                        <input type="hidden" name="password" value="{{ form.password.value }}">
                    {% endif %}
                    {% if form.password_check.value %}
                        <input type="hidden" name="password_check" value="{{ form.password_check.value }}">
                    {% endif %}
                </td>
            </tr>
            <tr>
                <th>お名前:</th>
                <td>
                    {{ form.name.value }}
                    <input type="hidden" name="name" value="{{ form.name.value }}">
                </td>
            </tr>
            <tr>
                <th>ご住所:</th>
                <td>
                    {{ form.address.value }}
                    <input type="hidden" name="address" value="{{ form.address.value }}">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="submit">変更</button>
                </td>
            </tr>
        </table>
    </form>
    <p><a href="{% url 'webapp:S01' %}">商品検索</a>へ</p>
</body>
</html>
