{% load static %}
<!DOCTYPE html>
<html>

    <link rel="stylesheet" type="text/css" href="{% static 'webapp/css/style.css' %}" />
</head>
<body>
    <form action="{% url 'webapp:M02' %}" method="POST">
        {% csrf_token %}
        <!-- <table>
            {{ form.as_table }}

        {% for field in form %}
            <div>
                {{ field.label }}

            </div>
        {% endfor %}
        <td colspan="2"><button type="submit">登録確認</button></td>
