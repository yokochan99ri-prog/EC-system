{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品詳細</title>
    <link rel="stylesheet" type="text/css" href="{% static 'webapp/css/style.css' %}" />
</head>
<body>
    <h3>商品の詳細表示</h3>
    <table>
        <tr>
            <th>商品名</th>
            <td>{{ product.name }}</td>
        </tr>
        <tr>
            <th>商品の色</th>
            <td>{{ product.color }}</td>
        </tr>
        <tr>
            <th>メーカー名</th>
            <td>{{ product.manufacturer }}</td>
        </tr>
        <tr>
            <th>価格</th>
            <td>{{ product.price }}</td>
        </tr>
        <tr>
            <th>在庫数</th>
            <td>{{ product.stock }}</td>
        </tr>
    </table>

    <form action="{% url 'webapp:S04' %}" method="get">
        数量
        <select name="quantity">
            {% for q in quantities %}
                <option value="{{ q }}">{{q}}</option>
            {% endfor %}
        </select>
        <br>
        <button type="submit">ショッピングカートに入れる</button>
    </form>


    <p><a href="{% url 'webapp:S01' %}">商品検索</a>へ</p>
</body>
</html>
